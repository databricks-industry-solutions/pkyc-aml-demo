command:
  - uv
  - run
  - start-app

# Workspace-specific values (WAREHOUSE_ID, CATALOG_SCHEMA, VOLUME_PATH, LAKEBASE_INSTANCE_NAME,
# MLFLOW_EXPERIMENT_ID) are patched into this file at deploy time by
# notebooks/scene1_kyc_onboarding/03_kyc_agent_deploy.ipynb. Defaults below are placeholders
# matching notebooks/_shared/config.py — only meaningful for local-only inspection.
env:
  - name: MLFLOW_TRACKING_URI
    value: databricks
  - name: MLFLOW_REGISTRY_URI
    value: databricks-uc
  - name: API_PROXY
    value: http://localhost:8000/invocations
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  - name: WAREHOUSE_ID
    value: ""
  - name: CATALOG_SCHEMA
    value: main.kyc_demo
  - name: VOLUME_PATH
    value: /Volumes/main/kyc_demo/agent_volume
  - name: DEMO_SBI_CODE
    value: "47.11"
  - name: LAKEBASE_INSTANCE_NAME
    value: kyc-lakebase
  - name: MLFLOW_EXPERIMENT_ID
    value: ""
