# Unified Databricks Asset Bundle: KYC/AML Industry Demo
# Consolidates: KYC Agent (Scene 1), Fraud Detection Pipeline (Scene 2), Frontend App
#
# Deploy:  databricks bundle deploy --target dev

bundle:
  name: kyc_aml_demo

variables:
  # Shared
  catalog:
    description: Unity Catalog name
    default: main
  schema:
    description: Schema for all demo tables and UC functions
    default: kyc_demo

  # Scene 1 - KYC Agent
  llm_endpoint:
    description: Model serving endpoint for the agent LLM
    default: databricks-meta-llama-3-3-70b-instruct

  # Scene 2 - Fraud Detection Pipeline
  sepa_table_name:
    description: Source table for SEPA transactions
    default: sepa_transactions
  pipeline_name:
    description: DLT pipeline name
    default: SEPA KYC Demo Pipeline

  # Workspace-specific values (genie_space_id, dashboard_embed_url, warehouse_id,
  # lakebase_instance_name, mlflow_experiment_id) are NOT bundle variables — DAB cannot
  # currently propagate them into a synced app.yaml. Configure them where they're consumed:
  #   - app/app.yaml — GENIE_SPACE_ID, DASHBOARD_EMBED_URL (or via app UI Environment tab)
  #   - notebooks/scene1_kyc_onboarding/03_kyc_agent_deploy.ipynb widgets — WAREHOUSE_ID
  #   - agents/kyc_agent/app.yaml — patched at deploy time by 03_kyc_agent_deploy.ipynb

sync:
  paths:
    - notebooks
    - pipelines
    - agents
    - app
    - volume_assets
  exclude:
    - "**/__pycache__"
    - "**/.ipynb_checkpoints"
    - "**/mlruns"
    - "**/*.db"
    - "**/_docs"
    - "**/.DS_Store"

# DAB syncs app/ but does not push it to compute. This hook runs after every
# `databricks bundle deploy` and tells the running compute to use the synced source.
experimental:
  scripts:
    # Push synced source to the running app. Idempotent start (no-op if already ACTIVE),
    # then deploy. `--source-code-path` is required on first deploy after destroy.
    postdeploy: |
      databricks apps start kyc-aml-frontend --target ${bundle.target} 2>/dev/null || true
      databricks apps deploy kyc-aml-frontend --target ${bundle.target} --source-code-path ${workspace.file_path}/app

permissions:
  - level: CAN_VIEW
    group_name: users

resources:
  # ── Frontend App ────────────────────────────────────────────────────────
  apps:
    frontend:
      name: kyc-aml-frontend
      description: "KYC/AML Industry Demo - Interactive 6-scene frontend"
      source_code_path: app
      # Workspace-specific env (GENIE_SPACE_ID, DASHBOARD_EMBED_URL) must be set
      # in app/app.yaml or via the app UI's Environment tab before/after deploy.
      # DAB does not currently propagate env to synced app.yaml.

  # ── Scene 2: DLT Fraud Detection Pipeline ──────────────────────────────
  pipelines:
    sepa_kyc_pipeline:
      name: ${var.pipeline_name}
      catalog: ${var.catalog}
      schema: ${var.schema}
      libraries:
        - file:
            path: pipelines/sepa_pipeline.py
      configuration:
        catalog_name: ${var.catalog}
        schema_name: ${var.schema}
        SEPA_SOURCE_TABLE: ${var.catalog}.${var.schema}.${var.sepa_table_name}
        SEPA_FRAUD_MODEL_URI: models:/${var.catalog}.${var.schema}.sepa_fraud_model@Production
      environment:
        dependencies:
          - flask>=3.0
          - mlflow==3.11.1
          - cloudpickle==3.1.2
          - numpy>=1.26.4
          - pandas>=1.5.3
          - psutil==5.9.0
          - pyarrow>=8.0.0
          - scikit-learn>=1.7.2
          - scipy>=1.10.0
      continuous: true
      serverless: true


targets:
  dev:
    mode: development
    default: true
