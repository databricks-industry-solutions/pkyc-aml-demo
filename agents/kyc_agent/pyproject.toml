[project]
name = "kyc-onboarding-agent"
version = "0.1.0"
description = "KYC onboarding agent for BankBricks (Responses API)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12",
  "uvicorn>=0.34.2",
  "mlflow>=3.11.1",
  "python-dotenv",
  "langchain-core",
  "langchain",
  "databricks-langchain[memory]>=0.16.0",
  "unitycatalog-ai[databricks]",
  "databricks-openai>=0.9.0",
  "databricks-sdk",
]

[project.scripts]
start-app = "agent_server.start_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server"]
